<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Coin Flip Streak Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <h1 class="game-title">PIXEL COIN FLIP</h1>
            <div class="score-display">
                <div class="score-item">
                    <span class="label">STREAK:</span>
                    <span id="streak" class="value">0</span>
                </div>
                <div class="score-item">
                    <span class="label">MULTIPLIER:</span>
                    <span id="multiplier" class="value">1.0x</span>
                </div>
                <div class="score-item">
                    <span class="label">SCORE:</span>
                    <span id="score" class="value">0</span>
                </div>
            </div>
        </div>

        <div class="game-area">
            <div class="coin-container">
                <div id="coin" class="coin">
                    <div class="coin-face heads">H</div>
                    <div class="coin-face tails">T</div>
                </div>
            </div>

            <div class="prediction-area">
                <h2 class="prediction-title">PICK YOUR SIDE</h2>
                <div class="prediction-buttons">
                    <button id="heads-btn" class="prediction-btn heads-btn">HEADS</button>
                    <button id="tails-btn" class="prediction-btn tails-btn">TAILS</button>
                </div>
            </div>

            <div class="flip-area">
                <button id="flip-btn" class="flip-button" disabled>FLIP COIN</button>
            </div>

            <div class="result-area">
                <div id="result-text" class="result-text"></div>
                <div id="streak-text" class="streak-text"></div>
            </div>
        </div>

        <div class="game-footer">
            <button id="reset-btn" class="reset-button">RESET GAME</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
