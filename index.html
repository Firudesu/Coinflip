<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tavern Coin Flip Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            height: 100vh;
            background-image: url('tavern image.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .game-container {
            background: rgba(0, 0, 0, 0.8);
            border: 3px solid #8B4513;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            max-width: 500px;
            width: 90%;
        }

        h1 {
            color: #FFD700;
            font-size: 2.5em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            font-weight: bold;
        }

        .coin {
            width: 200px;
            height: 200px;
            margin: 30px auto;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s;
        }

        .coin.flipping {
            animation: flip 0.6s ease-in-out;
        }

        @keyframes flip {
            0% { transform: rotateY(0deg); }
            50% { transform: rotateY(900deg); }
            100% { transform: rotateY(1800deg); }
        }

        .coin-face {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4em;
            font-weight: bold;
            color: #FFD700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            border: 4px solid #8B4513;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }

        .heads {
            background: linear-gradient(135deg, #FFD700, #FFA500);
        }

        .tails {
            background: linear-gradient(135deg, #C0C0C0, #808080);
            transform: rotateY(180deg);
        }

        .flip-button {
            background: linear-gradient(135deg, #8B4513, #A0522D);
            color: #FFD700;
            border: 3px solid #FFD700;
            padding: 15px 30px;
            font-size: 1.5em;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 20px 0;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .flip-button:hover {
            background: linear-gradient(135deg, #A0522D, #8B4513);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }

        .flip-button:active {
            transform: translateY(0);
        }

        .flip-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .result {
            color: #FFD700;
            font-size: 1.8em;
            font-weight: bold;
            margin: 20px 0;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
            color: #FFD700;
            font-size: 1.2em;
        }

        .stat {
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 15px;
            border-radius: 10px;
            border: 2px solid #8B4513;
        }

        .reset-button {
            background: linear-gradient(135deg, #DC143C, #B22222);
            color: white;
            border: 2px solid #FFD700;
            padding: 10px 20px;
            font-size: 1em;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.3s ease;
        }

        .reset-button:hover {
            background: linear-gradient(135deg, #B22222, #DC143C);
            transform: translateY(-1px);
        }

        @media (max-width: 600px) {
            .game-container {
                padding: 20px;
                margin: 20px;
            }
            
            h1 {
                font-size: 2em;
            }
            
            .coin {
                width: 150px;
                height: 150px;
            }
            
            .coin-face {
                font-size: 3em;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🎲 Tavern Coin Flip 🎲</h1>
        
        <div class="coin" id="coin">
            <div class="coin-face heads">H</div>
            <div class="coin-face tails">T</div>
        </div>
        
        <div class="result" id="result">Click the button to flip the coin!</div>
        
        <button class="flip-button" id="flipButton" onclick="flipCoin()">
            Flip Coin
        </button>
        
        <div class="stats">
            <div class="stat">
                <div>Heads: <span id="headsCount">0</span></div>
            </div>
            <div class="stat">
                <div>Tails: <span id="tailsCount">0</span></div>
            </div>
            <div class="stat">
                <div>Total: <span id="totalCount">0</span></div>
            </div>
        </div>
        
        <button class="reset-button" onclick="resetStats()">
            Reset Stats
        </button>
    </div>

    <script>
        let headsCount = 0;
        let tailsCount = 0;
        let totalCount = 0;
        let isFlipping = false;

        function flipCoin() {
            if (isFlipping) return;
            
            isFlipping = true;
            const coin = document.getElementById('coin');
            const result = document.getElementById('result');
            const flipButton = document.getElementById('flipButton');
            
            flipButton.disabled = true;
            coin.classList.add('flipping');
            result.textContent = 'Flipping...';
            
            // Random result
            const isHeads = Math.random() < 0.5;
            
            setTimeout(() => {
                coin.classList.remove('flipping');
                
                if (isHeads) {
                    headsCount++;
                    result.textContent = 'Heads! 🎉';
                    result.style.color = '#90EE90';
                } else {
                    tailsCount++;
                    result.textContent = 'Tails! 🎉';
                    result.style.color = '#90EE90';
                }
                
                totalCount++;
                updateStats();
                
                isFlipping = false;
                flipButton.disabled = false;
                
                // Reset result color after a moment
                setTimeout(() => {
                    result.style.color = '#FFD700';
                }, 2000);
                
            }, 600);
        }

        function updateStats() {
            document.getElementById('headsCount').textContent = headsCount;
            document.getElementById('tailsCount').textContent = tailsCount;
            document.getElementById('totalCount').textContent = totalCount;
        }

        function resetStats() {
            headsCount = 0;
            tailsCount = 0;
            totalCount = 0;
            updateStats();
            
            const result = document.getElementById('result');
            result.textContent = 'Stats reset! Click to flip again!';
            result.style.color = '#FFD700';
        }

        // Add some interactive effects
        document.addEventListener('keydown', function(event) {
            if (event.code === 'Space' && !isFlipping) {
                event.preventDefault();
                flipCoin();
            }
        });

        // Add click sound effect (visual feedback)
        document.getElementById('flipButton').addEventListener('click', function() {
            this.style.transform = 'scale(0.95)';
            setTimeout(() => {
                this.style.transform = '';
            }, 100);
        });
    </script>
</body>
</html>
